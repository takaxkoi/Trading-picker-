name: Edge Lab + performance
on:
  schedule:
    - cron: "50 23 * * 1-5"   # weeknights after the data vault
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oracle-edge
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      ORACLE_SYNC_TOKEN: ${{ secrets.ORACLE_SYNC_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/edge.yml
      - run: pip install -q vectorbt quantstats "pandas<2.3" "numpy<2.3" "plotly<6" pyyaml requests
      - name: Investor lenses
        run: python -m app.lenses
      - name: Performance report
        run: python -m app.perf
      - name: Edge Lab
        run: python -m app.edge
      - name: Save results
        if: always()
        run: ./scripts/commit.sh "edge lab"
