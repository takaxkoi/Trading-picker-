name: Research desk
on:
  schedule:
    - cron: "45 13,21 * * 1-5"   # after the open and after the close
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oracle-desk
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY || secrets.FINHUB }}
      ORACLE_SYNC_TOKEN: ${{ secrets.ORACLE_SYNC_TOKEN || secrets.ORACLE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/desk.yml
      - run: pip install -q openbb openbb-yfinance pyyaml requests numpy
      - name: Build OpenBB (needs its own process)
        run: python -c "import openbb; openbb.build()" || true
      - name: Movers, yield curve, filings
        run: python -m app.desk
      - name: Save results
        if: always()
        run: ./scripts/commit.sh "research desk"
