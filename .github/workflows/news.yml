name: News desk
on:
  schedule:
    - cron: "25 12,16,20 * * 1-5"   # before the open, midday and near the close
    - cron: "25 14 * * 0,6"          # once a day on weekends
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oracle-news
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      ORACLE_SYNC_TOKEN: ${{ secrets.ORACLE_SYNC_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/news.yml
      - run: pip install -q requests pyyaml numpy transformers && pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-finbert-v1
      - name: Headlines + sentiment
        run: python -m app.news
      - name: WallStreetBets board
        if: always()
        run: python -m app.wsb
      - name: Save results
        if: always()
        run: ./scripts/commit.sh "news desk"
