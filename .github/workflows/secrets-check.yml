name: Secrets check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Which keys are saved (names only, never values)
        run: |
          echo "TICKERBOT_API_KEY=${{ secrets.TICKERBOT_API_KEY != '' }}"
          echo "TICKERBOT_KEY=${{ secrets.TICKERBOT_KEY != '' }}"
          echo "TICKERBOT=${{ secrets.TICKERBOT != '' }}"
          echo "TICKER_BOT_API_KEY=${{ secrets.TICKER_BOT_API_KEY != '' }}"
          echo "TICKERBOT_API=${{ secrets.TICKERBOT_API != '' }}"
          echo "TB_API_KEY=${{ secrets.TB_API_KEY != '' }}"
          echo "ORACLE_SYNC_TOKEN=${{ secrets.ORACLE_SYNC_TOKEN != '' }}"
          echo "FINNHUB_API_KEY=${{ secrets.FINNHUB_API_KEY != '' }}"
          echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY != '' }}"
          echo "ALPHAVANTAGE_API_KEY=${{ secrets.ALPHAVANTAGE_API_KEY != '' }}"
          echo "ALPHA_VANTAGE_API_KEY=${{ secrets.ALPHA_VANTAGE_API_KEY != '' }}"
          echo "FRED_API_KEY=${{ secrets.FRED_API_KEY != '' }}"
          echo "ALPACA_KEY_ID=${{ secrets.ALPACA_KEY_ID != '' }}"
          echo "ALPACA_SECRET_KEY=${{ secrets.ALPACA_SECRET_KEY != '' }}"
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN != '' }}"
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID != '' }}"
